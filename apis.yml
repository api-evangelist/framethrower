name: FrameThrower
aid: framethrower
description: FrameThrower is a film-still reference library for filmmakers, students and creative teams, indexed
  frame by frame on lighting, lens character, shot size, camera angle, colour palette, mood and era. A REST API
  (OpenAPI 3.1 at https://framethrower.ai/api/v1/openapi.json, 11 endpoints, bearer-token auth) and an MCP server
  at https://framethrower.ai/api/mcp (four tools, OAuth 2.1) expose visual-reference search and film and frame information;
  an npm SDK (framethrower-ai) and an MIT-licensed MCP repository (github.com/framethrower-ai/framethrower-mcp)
  are published. Free plan with usage-based paid upgrades. Submitter-stated by the founder, Leo Kadieff.
url: https://raw.githubusercontent.com/api-evangelist/framethrower/refs/heads/main/apis.yml
x-type: company
x-source: apis-io-submission
x-submitted-by: Leo Kadieff (founder), leo@framethrower.ai, email to info@apis.io 2026-09-25
x-probe-note: framethrower.ai is a Next.js site that answers invented top-level paths (e.g. /this-does-not-exist-xyz,
  /privacy, /terms) with the same 200 HTML shell, while /.well-known/* misses and /openapi.json return 404. Never
  credit a well-known or index document from a status code; only a body that parses as the named format counts.
  The real machine surfaces are /api/v1/openapi.json, /api/v1 (JSON reference), /llms.txt, /api/mcp and the two
  OAuth metadata documents under /.well-known/. The real legal pages are /legal/tos and /legal/privacy.
x-tier: profiled
x-tier-reason: enrichment pass 2026-09-25 (local-v5; was email submission worked by the support sweep 2026-09-25;
  OpenAPI 3.1 (11 paths), MCP initialize 200, llms.txt 200, npm SDK published; site is an SPA catch-all)
